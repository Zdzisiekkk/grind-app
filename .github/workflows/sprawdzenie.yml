# Sprawdzenie każdej zmiany przed wdrożeniem: typy, lint, budowanie.
name: Sprawdzenie kodu

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sprawdz:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typy
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Migracje w PGlite
        run: npm run validate:sql
      # Skrypty testowe nie przechodzą przez tsc, więc literówkę w nich
      # wyłapywał dopiero wywalony test na produkcji.
      - name: Składnia skryptów
        run: for f in scripts/*.mjs; do node --check "$f"; done
      - name: Testy jednostkowe
        run: |
          npm run test:db
          npm run test:offline
          npm run test:analysis
          npm run test:vices
          npm run test:isbn
          npm run test:daty
          npm run test:wyglad
          npm run test:looks
          npm run test:barcode
          npm run test:sen
          npm run test:budzet
          npm run test:posilek
          npm run test:produkty
      - name: Budowanie
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://przyklad.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: klucz-do-budowania
